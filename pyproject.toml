[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-conductor"
version = "0.1.0"
description = "Local-first durable control plane for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conductor = ["schema.sql"]
