name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-14]

    steps:
      - name: Select short temporary paths for Unix sockets
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Record native host identity
        run: |
          uname -srm
          rustc -vV

      - name: Require a native Linux arm64 host
        if: matrix.os == 'ubuntu-26.04-arm'
        run: test "$(uname -m)" = aarch64

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build operator integration binaries
        run: cargo build --workspace

      - name: Install Linux check isolation dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run workspace tests
        env:
          CONDUCTOR_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
        run: cargo test --workspace --all-features

      - name: Exercise a receiving worker under a distinct OS UID
        run: |
          python3 -m unittest discover -s tests -p test_cross_uid_launcher.py -v
          python3 tools/run_cross_uid_test.py

      - name: Check operator recovery and publication refusals
        env:
          CONDUCTOR_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
        run: |
          python3 -m unittest discover -s tests -p test_operator_backup.py -v
          python3 -m unittest discover -s tests -p test_operator_profiles.py -v
          python3 -m unittest discover -s tests -p test_account_preflight.py -v
          python3 -m unittest discover -s tests -p test_adapter_pins.py -v
          python3 -m unittest discover -s tests -p 'test_conductor_rpc*.py' -v
          python3 -m unittest discover -s tests -p test_package_launcher.py -v
          python3 -m unittest discover -s tests -p test_package_runtime.py -v
          python3 -m unittest discover -s tests -p test_restore_publication.py -v
          python3 -m unittest discover -s tests -p test_disaster_recovery.py -v
          python3 -m unittest discover -s tests -p test_host_recovery_integration.py -v
          python3 -m unittest discover -s tests -p test_soak_control_plane.py -v
          python3 -m unittest discover -s tests -p test_runner_process_inventory.py -v
          python3 -m unittest discover -s tests -p test_auxiliary_process_inventory.py -v
          python3 -m unittest discover -s tests -p test_native_observation_guard.py -v
          python3 -m unittest discover -s tests -p test_run_native_monitor.py -v
          python3 -m unittest discover -s tests -p test_native_resource_guard.py -v
          python3 -m unittest discover -s tests -p test_native_stale_control.py -v
          python3 -m unittest discover -s tests -p test_escaped_runner.py -v
          python3 -m unittest discover -s tests -p test_verification_surface.py -v

      - name: Check board diagnostic rendering
        run: node --test tests/board_diagnostics.cjs

      - name: Build and test release runtime
        env:
          CONDUCTOR_TEST_BIN_DIR: ${{ github.workspace }}/target/release
        run: |
          cargo build --locked --release --workspace
          cargo test --locked --release --workspace --all-features

      - name: Package and verify native runtime kit
        env:
          KIT_NAME: conductor-${{ runner.os }}-${{ runner.arch }}
        run: |
          python3 tools/package_runtime.py --bin-dir target/release --destination "target/dist/$KIT_NAME" > target/runtime-kit-receipt.json
          mkdir target/kit-verification
          tar -xzf "target/dist/$KIT_NAME.tar.gz" -C target/kit-verification
          python3 tools/package_runtime.py --verify "target/kit-verification/$KIT_NAME"
          python3 -E -s "target/kit-verification/$KIT_NAME/tools/conductor" --help
          python3 tools/smoke_runtime_kit.py --kit "target/kit-verification/$KIT_NAME"

      - name: Reject committed credential material
        shell: bash
        run: |
          if git grep -nEI '(sk-ant-|sk-proj-|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Credential-shaped material is committed.' >&2
            exit 1
          fi

      - name: Upload verified native runtime kit
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conductor-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/dist/*.tar.gz
            target/runtime-kit-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
