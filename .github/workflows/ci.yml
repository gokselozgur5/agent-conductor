name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Select short temporary paths for Unix sockets
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build operator integration binaries
        run: cargo build --workspace

      - name: Run workspace tests
        env:
          CONDUCTOR_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
        run: cargo test --workspace --all-features

      - name: Exercise a receiving worker under a distinct OS UID
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests -p test_cross_uid_launcher.py -v
          python3 tools/run_cross_uid_test.py

      - name: Check operator recovery and publication refusals
        env:
          CONDUCTOR_TEST_BIN_DIR: ${{ github.workspace }}/target/debug
        run: |
          python3 -m unittest discover -s tests -p test_operator_backup.py -v
          python3 -m unittest discover -s tests -p test_operator_profiles.py -v
          python3 -m unittest discover -s tests -p test_adapter_pins.py -v
          python3 -m unittest discover -s tests -p 'test_conductor_rpc*.py' -v
          python3 -m unittest discover -s tests -p test_package_launcher.py -v
          python3 -m unittest discover -s tests -p test_restore_publication.py -v
          python3 -m unittest discover -s tests -p test_disaster_recovery.py -v
          python3 -m unittest discover -s tests -p test_host_recovery_integration.py -v
          python3 -m unittest discover -s tests -p test_soak_control_plane.py -v
          python3 -m unittest discover -s tests -p test_runner_process_inventory.py -v
          python3 -m unittest discover -s tests -p test_auxiliary_process_inventory.py -v
          python3 -m unittest discover -s tests -p test_native_observation_guard.py -v
          python3 -m unittest discover -s tests -p test_run_native_monitor.py -v
          python3 -m unittest discover -s tests -p test_native_resource_guard.py -v
          python3 -m unittest discover -s tests -p test_native_stale_control.py -v
          python3 -m unittest discover -s tests -p test_escaped_runner.py -v
          python3 -m unittest discover -s tests -p test_verification_surface.py -v

      - name: Check board diagnostic rendering
        run: node --test tests/board_diagnostics.cjs

      - name: Reject committed credential material
        shell: bash
        run: |
          if git grep -nEI '(sk-ant-|sk-proj-|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Credential-shaped material is committed.' >&2
            exit 1
          fi
