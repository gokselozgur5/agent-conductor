[workspace]
members = ["crates/store"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }
