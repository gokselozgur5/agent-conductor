[workspace]
members = [
    "crates/domain",
    "crates/protocol",
    "crates/service",
    "crates/store",
    "crates/daemon",
    "crates/cli",
    "crates/testkit",
    "crates/runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
notify = "8.2.1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Executable identity verification also hashes large vendor binaries in debug builds.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
